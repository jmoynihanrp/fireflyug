<!DOCTYPE html>
<html>

<head>
    <title>{{properties.title}}</title>
</head>

<body>
    <header></header>
    <main>
        <div class="article-detail-wrapper">
            <div class="article-detail block" data-block-name="article-detail" data-block-status="loaded">
                <div class="article-image"><img src="{{image}}">
                </div>
                <div class="article-content">
                    <h1 class="article-title">{{title}}</h1>
                    <p class="article-author">By {{author}}</p>
                    <p class="article-date">Date: {{publishDate}}</p>
                    <p class="article-body">
                    <p>{{body}}</p>
                    </p>
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
</body>

</html>
