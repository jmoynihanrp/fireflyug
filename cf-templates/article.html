<!DOCTYPE html>
<html>

<head>
    <title>{{properties.title}}</title>
</head>

<body>
    <header></header>
    <main>
        <div>
            
            <h1>{{properties.elements.articleTitle.value}}</h1>
            <div class="columns">
                <div>
                    <div>
                        <p>
                            <picture>
                                <img src="{{{properties.elements.articleImage.value}}}">
                            </picture>
                        </p>
                    </div>
                </div>
                <div>
                    <div>
                        <p><strong>Author:</strong> {{properties.elements.author.value}}</p>
                        <p><strong>Date:</strong> {{properties.elements.publishDate.value}}</p>
                        <p>{{{properties.elements.articleBody.value}}}</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
</body>

</html>
