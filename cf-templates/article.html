<!DOCTYPE html>
<html>

<head>
    <title>{{properties.title}}</title>
</head>

<body>
    <header></header>
    <main>
        <div class="article-detail-wrapper">
            <div class="article-detail block" data-block-name="article-detail">
                <div class="article-image"><img src="{{{properties.elements.articleImage.value}}}" alt="{{{properties.elements.title.value}}}"/></div>
                </div>
                <div class="article-content">
                    <h1 class="article-title">{{{properties.elements.title.value}}}</h1>
                    <p class="article-author">By {{{properties.elements.author.value}}}</p>
                    <p class="article-date">Date: {{{properties.elements.publishDate.value}}}</p>
                    <p class="article-body">
                    <p>{{{properties.elements.articleBody.value}}}</p>
                    </p>
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
</body>

</html>
