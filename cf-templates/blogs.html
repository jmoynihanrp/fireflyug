<!DOCTYPE html>
<html>

<head>
    <title>Blogs</title>
    <link rel="stylesheet" href="/static/styles/blog.css">
</head>

<body>
    <header></header>
    <main>
        <div>
            <div class="blog-list">
                    {{#articles}}
                    <div>
                        <div>
                            <p>{{{urlkey}}}</p>
                            <p>
                               {{{image}}}
                            </p>

                        </div>
                        <div>
                            <h2>{{{title}}}</h2>
                            <p>By: {{{author}}}</p>
                            <p>Date: {{{publishDate}}}</p>
                            {{{description}}}
                        </div>
                    </div>
                    {{/articles}}
            </div>
        </div>
    </main>
    <footer></footer>
</body>

</html>
