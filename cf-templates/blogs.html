<!DOCTYPE html>
<html>

<head>
    <title>Blogs</title>
    <link rel="stylesheet" href="/static/styles/blog.css">
</head>

<body>
    <header></header>
    <main>
        <div class="section">
            <div class="blog-list">
                <ul>
                    {{#articles}}
                    <li>
                        <a href="{{{urlkey}}}">
                            <img src="{{{image}}}" />
                            <h2>{{{title}}}</h2>
                            <p>
                                <span>By {{{author}}}</span>
                                <span>Date: {{{publishDate}}}</span>
                            </p>
                            {{{description}}}
                            <div></div>
                        </a>
                    </li>
                    {{/articles}}
                </ul>
            </div>
        </div>
    </main>
    <footer></footer>
</body>

</html>
