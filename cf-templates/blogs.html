<!DOCTYPE html>
<html>

<head>
    <title>Blogs</title>
    <link rel="stylesheet" href="/static/styles/blog.css">
</head>

<body>
    <header></header>
    <main>
        <div> <!--Section-->
            <div></div><!--Hero-->
            <div> <!--Section-->
                <div><!--List-->
                    <div>
                        <ul>
                            {{#articles}}
                            <li>
                                <a href="/blogs/{{path}}">
                                    <img alt="{{title}}" class="blog-image"
                                        src="https://publish-p133739-e1306963.adobeaemcloud.com/{{{image}}}">
                                    <p>{{title}}</p>
                                    <p>
                                        <span>By {{author}}</span>
                                        <span>Date: {{publishDate}}</span>
                                    </p>
                                    <span>{{{description}}}</span>
                                    <div></div>
                                </a>
                            </li>
                            {{/articles}}
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
</body>

</html>
