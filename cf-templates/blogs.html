<!DOCTYPE html>
<html>

<head>
    <title>Blogs</title>
    <link rel="stylesheet" href="/static/styles/blog.css">
</head>

<body>
    <header></header>
    <main>
        <div class="section">
            <div class="columns">
                <div>
                    {{#articles}}
                        <picture>
                            <img alt="{{{title}}}" src="{{{image}}}" />
                        </picture>
                        <h2>{{{title}}}</h2>
                        <p>
                            <span>By {{{author}}}</span>
                            <span>Date: {{{publishDate}}}</span>
                        </p>
                        {{{description}}}
                        <a href="{{{urlkey}}}">Go to Article</a>
                    {{/articles}}
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
</body>

</html>
