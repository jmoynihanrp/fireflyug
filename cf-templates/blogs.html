<!DOCTYPE html>
<html>

<head>
    <title>Blogs</title>
    <link rel="stylesheet" href="/static/styles/blog.css">
</head>

<body>
    <header></header>
    <main>
        <div class="section">
                <div class="blog-list block">
                    <ul>
                        {{#articles}}
                        <li>

                                <img alt="{{{title}}}" src="{{{image}}}" /> 
                                <p>{{{title}}}</p>
                                <p>
                                    <span>By {{{author}}}</span>
                                    <span>Date: {{{publishDate}}}</span>
                                </p>
                                <span>{{{description}}}</span>
                                <div></div>
                                 <a href="{{{urlkey}}}">Go to Article</a>
                        </li>
                        {{/articles}}
                    </ul>
                    </div>
        </div>
    </main>
    <footer></footer>
</body>

</html>
