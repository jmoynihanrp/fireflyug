<!DOCTYPE html>
<html>

<head>
    <title>Blogs</title>
    <link rel="stylesheet" href="/static/styles/blog.css">
</head>

<body>
    <header></header>
    <main>
        <div>
            <div class="blog-list">
                <ul>
                    {{#articles}}
                    <li>
                        <picture>
                             <img src="{{{image}}}" />
                        </picture>
                        <h2>{{{title}}}</h2>
                        <div>
                            <p>By {{{author}}}</p>
                            <p>Date: {{{publishDate}}}</p>
                        </div>
                        <div>{{{description}}}</div>
                        <div><a href="{{{urlkey}}}">Go to Article</a></div>
                    </li>
                    {{/articles}}
                </ul>
            </div>
        </div>
    </main>
    <footer></footer>
</body>

</html>
